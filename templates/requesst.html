<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حالة الطلب - CrowdSense AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stylerequesst.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
<header class="main-header">
    <div class="logo-group">
    <i class="fas fa-users-cog" class="logo-icon"></i>
    <div class="logo-text">خطوات  <span class="ai-text">امنة</span></div>
</div>
    <nav class="nav-tabs">
        <a href="{{ url_for('logout') }}" class="nav-tab">تسجيل خروج</a>
    </nav>
</header>
<div class="status-container">
    <div class="card">
        <h2>حالة الطلب</h2>

        {% if name %}
            <div class="user-info">
                <p><span>👤 الاسم:</span> {{ name }}</p>
                <p><span>📧 الإيميل:</span> {{ email }}</p>
            </div>

            <div class="status 
                {% if status == 'Accepted' %} accepted
                {% elif status == 'Rejected' %} rejected
                {% else %} inprogress
                {% endif %}">
                
                {% if status == 'Accepted' %} مقبول
                {% elif status == 'Rejected' %} مرفوض
                {% else %} قيد المعالجة
                {% endif %}
            </div>
        {% else %}
            <div class="no-data">
                <p>❌ لا يوجد طلب مقدم حالياً</p>
            </div>
        {% endif %}
        
    </div>
</div>

</body>
</html>
